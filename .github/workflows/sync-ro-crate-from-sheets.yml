name: Sync RO-Crate from Google Sheets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ro-crate:
    runs-on: ubuntu-latest
    env:
      # Required: set this repository secret to a Google Sheets export URL.
      # Example:
      # https://docs.google.com/spreadsheets/d/<SHEET_ID>/export?format=xlsx&gid=0
      GOOGLE_SHEET_EXPORT_URL: ${{ secrets.GOOGLE_SHEET_EXPORT_URL }}

      # Optional: command used to run the local RO-Crate converter.
      # The script will auto-detect rocxl from node_modules/.bin.
      RO_CRATE_EXCEL_COMMAND: ""

      # Optional: commit message for generated changes.
      COMMIT_MESSAGE: "chore(ro-crate): sync from Google Sheets"

      # CI behavior flags.
      AUTO_COMMIT: "true"
      AUTO_PUSH: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install and initialize siegfried
        shell: bash
        run: |
          set -euo pipefail
          SF_BIN="$(go env GOPATH)/bin/sf"
          SF_SIG="${HOME}/.local/share/siegfried/default.sig"
          SF_DATA_URL="https://github.com/richardlehane/siegfried/releases/download/v1.11.6/data_1-11-6.zip"

          go install github.com/richardlehane/siegfried/cmd/sf@v1.11.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          mkdir -p "$(dirname "$SF_SIG")"

          # Avoid relying on sf -update endpoint in restricted networks.
          curl -fsSL "$SF_DATA_URL" -o /tmp/siegfried-data.zip
          unzip -p /tmp/siegfried-data.zip siegfried/default.sig > "$SF_SIG"

          "$SF_BIN" -version
          test -f "$SF_SIG"

      - name: Install RO-Crate converter locally
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save ro-crate-excel

      - name: Sync RO-Crate from spreadsheet
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sync-ro-crate-from-sheets.sh
